<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Map Hex / Mesh Overlay -->
  <path d="M24 40 L44 28 L64 40 L64 64 L44 76 L24 64 Z" fill="none" stroke="#81c784" stroke-width="2" stroke-opacity="0.4"/>
  <path d="M64 40 L84 28 L104 40 L104 64 L84 76 L64 64 Z" fill="none" stroke="#81c784" stroke-width="2" stroke-opacity="0.4"/>
  <path d="M44 76 L64 64 L84 76 L84 100 L64 112 L44 100 Z" fill="none" stroke="#81c784" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Wheat / Agricultural Stalk & Data Chart -->
  <!-- Stem -->
  <path d="M64 102 C64 65 64 35 64 24" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Grains / Leaves (Left & Right) -->
  <path d="M64 32 C50 28 44 40 64 48" fill="url(#gold)" stroke="#fff" stroke-width="1.5"/>
  <path d="M64 32 C78 28 84 40 64 48" fill="url(#gold)" stroke="#fff" stroke-width="1.5"/>
  <path d="M64 46 C46 42 40 56 64 64" fill="url(#gold)" stroke="#fff" stroke-width="1.5"/>
  <path d="M64 46 C82 42 88 56 64 64" fill="url(#gold)" stroke="#fff" stroke-width="1.5"/>
  <path d="M64 62 C48 60 44 74 64 80" fill="url(#gold)" stroke="#fff" stroke-width="1.5"/>
  <path d="M64 62 C80 60 84 74 64 80" fill="url(#gold)" stroke="#fff" stroke-width="1.5"/>

  <!-- Top Spire Point -->
  <polygon points="64,18 61,26 67,26" fill="url(#gold)" stroke="#fff" stroke-width="1"/>

  <!-- Dynamic Circular Target / Spatial Pin at Base -->
  <circle cx="64" cy="98" r="7" fill="#00e676" stroke="#fff" stroke-width="2.5"/>
  <circle cx="64" cy="98" r="2.5" fill="#fff"/>
</svg>